- title: Research Interests
  type: nested_list
  contents:
    - title: Cybersecurity in Robotics
      items:
        - Adversarial attacks on autonomous vehicles and robots
        - Defense mechanisms for robotic systems (adversarial patches, perception attacks)
        - Machine learning security in cyber-physical systems
